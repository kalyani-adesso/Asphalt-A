%YAML 1.1
---
name: Project Config
version: 1.0.0
schema: v1

model_defaults: &model_defaults
  provider: openai
  apiBase: ${{ secrets.API_URL }}
  apiKey: ${{ secrets.API_KEY }}

roles_defaults: &roles_defaults
  - chat
  - edit
  - summarize

models:
  - name: qwen3-coder-480 €
    model: qwen3-coder-480b
    <<: *model_defaults
    roles: *roles_defaults
    defaultCompletionOptions:
      temperature: 0.4
      maxTokens: 8192
      contextLength: 16192
    requestOptions:
      timeout: 30000
      verifySsl: true
  - name: gemini-3-pro-preview €€€
    model: gemini-3-pro-preview
    <<: *model_defaults
    roles: *roles_defaults
    defaultCompletionOptions:
      temperature: 0.8
      maxTokens: 8192
      contextLength: 16192
    requestOptions:
      timeout: 30000
      verifySsl: true
  - name: claude-sonnet-v4.5 €€
    model: claude-sonnet-v4.5
    <<: *model_defaults
    roles: *roles_defaults
    defaultCompletionOptions:
      temperature: 0.4
      maxTokens: 8192
      contextLength: 16192
    requestOptions:
      timeout: 30000
      verifySsl: true
  - name: claude-opus-v4.5 €€€
    model: claude-opus-v4.5
    <<: *model_defaults
    roles: *roles_defaults
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 8192
      contextLength: 16192
    requestOptions:
      timeout: 30000
      verifySsl: true
  - name: gpt-5.1 €€
    model: gpt-5.1
    <<: *model_defaults
    roles: *roles_defaults
    defaultCompletionOptions:
      maxTokens: 8192
      contextLength: 16192
    requestOptions:
      timeout: 30000
      verifySsl: true
  - name: Apply-Model
    model: claude-haiku-4.5
    <<: *model_defaults
    roles:
      - apply
  #      - autocomplete
  - name: text-embedding-3-large
    model: text-embedding-3-large
    <<: *model_defaults
    roles:
      - embed
      - rerank
    embedOptions:
        maxChunkSize: 256
        maxBatchSize: 5

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase

